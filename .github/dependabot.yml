# Dependabot keeps three ecosystems aligned for amigo-native:
#
# - cargo: workspace-wide updates for every `Cargo.toml` under `crates/`
#   plus the root manifest
# - npm: per-crate `package.json` updates for both runtime and devDeps
# - github-actions: pinned action references in `.github/workflows/`
#
# Updates land as a single weekly batch on Monday morning UTC. The
# manifest layout is `crates/<name>/{Cargo.toml,package.json}` so we use
# `directories` (plural) where Dependabot supports it. Fall back to
# explicit per-directory entries where it doesn't.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # The ref after `@` on dtolnay/rust-toolchain pins the Rust *toolchain*
    # version, not the action release. Dependabot reads it as an action tag
    # and bumps to a tag that is not a real Rust release (e.g. 1.120.0),
    # which 404s at `rustup toolchain install` and breaks every Rust job.
    # Toolchain upgrades are made by hand against a real Rust version.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
