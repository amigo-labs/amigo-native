[workspace]
members = ["crates/*", "crates/*/wasm"]
# typst-{core,,/wasm} are excluded until a fix for the
# `typst-library` E0282 type-inference bug
# (foundations/str.rs:700 `self.as_ref().repr()`) is released upstream.
# All released 0.14.x versions (0.14.0–0.14.2) trip the bug on current
# stable rustc; upstream main has the `self.as_str()` fix but no new
# crates.io release yet. CI mirrors this skip via `BROKEN_CRATES` in
# .github/workflows/ci.yml.
exclude = ["crates/_template", "crates/_typst-core", "crates/typst", "crates/typst/wasm"]
resolver = "3"

# Inherited by every member via `edition.workspace = true`. Versions stay
# per-crate (release-please bumps them independently).
[workspace.package]
edition = "2024"

[workspace.lints.clippy]
# Modern-idiom guard: every lint below flags code that has a newer, stable
# std/language replacement. Clippy's default groups already cover the rest
# (collapsible_if → let chains, manual_div_ceil, io_other_error, ...).
# Members opt in with `[lints] workspace = true`.
allow_attributes = "warn"                # #[allow] → #[expect(.., reason)]
allow_attributes_without_reason = "warn"
non_std_lazy_statics = "warn"            # once_cell / lazy_static → LazyLock
manual_let_else = "warn"                 # match { .. => return } → let-else
manual_is_variant_and = "warn"           # .map(f).unwrap_or_default() → is_some_and
manual_ok_or = "warn"
manual_midpoint = "warn"
uninlined_format_args = "warn"
borrow_as_ptr = "warn"                   # &x as *const T → &raw const x
ref_as_ptr = "warn"
duration_suboptimal_units = "warn"       # from_secs(3600) → Duration::from_hours(1)
unnested_or_patterns = "warn"            # Some(A) | Some(B) → Some(A | B)
unchecked_time_subtraction = "warn"      # Instant - Duration can panic on underflow

[workspace.dependencies]
napi = { version = "3", default-features = false, features = ["napi4", "napi6", "serde-json"] }
napi-derive = "3"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
panic = "abort"

